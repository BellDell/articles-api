<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <div class="auth-card">
    <div class="accent-rule"></div>
    <h1>Register</h1>

    {% if error %}
    <div class="message-error">{{ error }}</div>
    {% endif %}

    <form class="auth-form" method="post" action="/auth/register">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" value="{{ username or '' }}" placeholder="Choose a username" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Create a password" required autocomplete="new-password">
      </div>
      <div class="field">
        <label for="confirm_password">Confirm Password</label>
        <input id="confirm_password" name="confirm_password" type="password" placeholder="Confirm your password" required autocomplete="new-password">
      </div>
      <button type="submit">Register</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/auth/login">Login here</a>
    </div>
  </div>
</body>
</html>
