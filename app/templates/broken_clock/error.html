{% extends "broken_clock/_layout.html" %}
{% block title %}Error{% endblock %}

{% block content %}
<div style="max-width:480px;margin:0 auto">
  <div class="bc-card">
    <div style="width:40px;height:3px;background:#dc2626;border-radius:2px;margin-bottom:12px"></div>
    <h1 class="card-title" style="color:#dc2626">Something went wrong</h1>
    <div style="background:var(--bc-slow-bg);border:1px solid #fecaca;border-radius:8px;padding:12px 16px;color:#7f1d1d;font-size:13px;margin-bottom:20px">
      {{ message }}
    </div>
    <a class="bc-btn" href="{{ back_url|default('/broken-clock') }}">
      ← {{ back_label|default('Calculate again') }}
    </a>
  </div>
</div>
{% endblock %}
