<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Broken Clock{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css"
        integrity="sha384-tl5h4XuWmVzPeVWU0x8bx0j/5iMwCBduLEgZ+2lH4Wjda+4+q3mpCww74dgAB3OX"
        crossorigin="anonymous">
  <style>
    :root {
      /* Warm Sand design tokens */
      --bc-bg-page:    #faf7f2;
      --bc-bg-surface: #ffffff;
      --bc-bg-subtle:  #f5f0e8;

      --bc-border:     #e8e0d5;
      --bc-border-mid: #d4c9b8;

      --bc-text-primary:   #1c1917;
      --bc-text-secondary: #78716c;
      --bc-text-muted:     #a8a29e;

      --bc-accent:         #c2410c;
      --bc-accent-hover:   #9a3412;
      --bc-accent-subtle:  #fff7ed;
      --bc-accent-border:  #fed7aa;

      --bc-fast:    #b45309;
      --bc-slow:    #b91c1c;
      --bc-ok:      #15803d;
      --bc-fast-bg: #fffbeb;
      --bc-slow-bg: #fef2f2;
      --bc-ok-bg:   #f0fdf4;

      --nav-h: 52px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bc-bg-page);
      color: var(--bc-text-primary);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    h1, h2, h3, .brand {
      font-family: Georgia, "Times New Roman", serif;
    }

    /* ── Navbar ── */
    .bc-nav {
      background: var(--bc-bg-page);
      border-bottom: 1px solid var(--bc-border);
      position: sticky;
      top: 0;
      z-index: 100;
      min-height: var(--nav-h);
    }
    .bc-nav .navbar-brand .navbar-item {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--bc-text-primary) !important;
      gap: 6px;
    }
    .bc-nav .navbar-item {
      font-size: 13px;
      font-weight: 500;
      color: var(--bc-text-secondary) !important;
      border-radius: 7px;
      padding: 6px 12px;
      margin: 4px 2px;
      transition: background 0.15s, color 0.15s;
    }
    .bc-nav .navbar-item:hover {
      background: var(--bc-bg-subtle) !important;
      color: var(--bc-text-primary) !important;
    }
    .bc-nav .navbar-item.is-active {
      background: var(--bc-accent-subtle) !important;
      color: var(--bc-accent) !important;
      font-weight: 600;
    }
    .bc-nav .navbar-brand { min-height: var(--nav-h); }

    /* Hamburger icon lines */
    .bc-nav .navbar-burger {
      color: var(--bc-text-secondary);
      height: var(--nav-h);
      width: var(--nav-h);
    }
    .bc-nav .navbar-burger span {
      background-color: var(--bc-text-secondary);
      height: 2px;
      left: calc(50% - 10px);
      width: 20px;
    }
    .bc-nav .navbar-burger span:nth-child(1) { top: calc(50% - 7px); }
    .bc-nav .navbar-burger span:nth-child(2) { top: calc(50% - 1px); }
    .bc-nav .navbar-burger span:nth-child(3) { top: calc(50% + 5px); }

    @media (max-width: 1023px) {
      .bc-nav .navbar-menu.is-active {
        background: var(--bc-bg-surface);
        border: 1px solid var(--bc-border);
        border-radius: 0 0 12px 12px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        padding: 0.5rem 1rem 1rem;
      }
    }

    /* ── Page wrapper ── */
    .bc-page {
      padding: 28px 20px;
      max-width: 100%;
    }

    /* ── Card ── */
    .bc-card {
      background: var(--bc-bg-surface);
      border: 1px solid var(--bc-border);
      border-radius: 12px;
      padding: 22px 24px;
      margin: 0 auto;
    }
    .bc-card h1,
    .bc-card .card-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      color: var(--bc-text-primary);
      margin-top: 0;
      margin-bottom: 0.5rem;
    }
    .bc-card .accent-rule {
      width: 40px;
      height: 3px;
      background: var(--bc-accent);
      border-radius: 2px;
      margin-bottom: 1rem;
    }

    /* ── Labels ── */
    .bc-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--bc-text-secondary);
      margin-bottom: 4px;
      display: block;
    }

    /* ── Inputs ── */
    .bc-input {
      background: var(--bc-bg-subtle);
      border: 1px solid var(--bc-border);
      border-radius: 8px;
      padding: 10px 13px;
      font-size: 14px;
      color: var(--bc-text-primary);
      width: 100%;
      box-sizing: border-box;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }
    .bc-input:focus {
      border-color: var(--bc-accent);
      box-shadow: 0 0 0 3px rgba(194,65,12,0.12);
    }
    .bc-input::placeholder { color: var(--bc-text-muted); }

    /* ── Buttons ── */
    .bc-btn {
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      padding: 10px 20px;
      background: var(--bc-accent) !important;
      border: none !important;
      color: #fff !important;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }
    .bc-btn:hover  { background: var(--bc-accent-hover) !important; transform: translateY(-1px); }
    .bc-btn:active { transform: translateY(0); }
    .bc-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    .bc-btn-ghost {
      background: transparent !important;
      color: var(--bc-text-secondary) !important;
      border: none;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 7px;
      transition: background 0.15s, color 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
    }
    .bc-btn-ghost:hover {
      background: var(--bc-bg-subtle);
      color: var(--bc-text-primary) !important;
    }

    /* ── Help text ── */
    .bc-help {
      font-size: 12px;
      color: var(--bc-text-muted);
      margin-top: 4px;
    }

    /* ── Status badges ── */
    .status-badge {
      display: inline-block;
      padding: 3px 11px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }
    .status-badge.fast     { background: var(--bc-fast-bg); color: var(--bc-fast); }
    .status-badge.slow     { background: var(--bc-slow-bg); color: var(--bc-slow); }
    .status-badge.accurate { background: var(--bc-ok-bg);   color: var(--bc-ok); }

    /* ── Day badges ── */
    .day-badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 20px;
      font-weight: 600;
      white-space: nowrap;
    }
    .day-badge.same { background: var(--bc-ok-bg);   color: var(--bc-ok); }
    .day-badge.prev { background: var(--bc-fast-bg); color: var(--bc-fast); }
    .day-badge.next { background: #eff6ff;           color: #1d4ed8; }

    {% block extra_style %}{% endblock %}
  </style>
</head>
<body>

<nav class="navbar bc-nav" role="navigation" aria-label="main navigation">
  <div class="navbar-brand">
    <a class="navbar-item" href="/">⏰ Broken Clock</a>
    <button type="button" class="navbar-burger" aria-label="menu" aria-expanded="false"
       data-target="bc-navbar-menu">
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </button>
  </div>

  <div id="bc-navbar-menu" class="navbar-menu">
    <div class="navbar-start">
      <a class="navbar-item {% if active_page == 'home' %}is-active{% endif %}"
         href="/">Home</a>
      <a class="navbar-item {% if active_page == 'calculator' %}is-active{% endif %}"
         href="/broken-clock">Calculator</a>
      <a class="navbar-item {% if active_page == 'water_meter' %}is-active{% endif %}"
         href="/water-meter">Water Meter</a>
    </div>

    <div class="navbar-end">
      {% if username %}
      <span class="navbar-item" style="color: var(--bc-text-secondary); font-size: 13px;">
        Logged in as <strong style="margin-left: 4px;">{{ username }}</strong>
      </span>
      <form action="/auth/logout" method="post" style="display: inline;">
        <button type="submit" class="navbar-item"
                style="background: none; border: none; cursor: pointer; font-size: 13px;
                       color: var(--bc-text-secondary);">Logout</button>
      </form>
      {% endif %}
    </div>
  </div>
</nav>

<div class="bc-page">
{% block content %}{% endblock %}
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const burgers = document.querySelectorAll('.navbar-burger');
    burgers.forEach(burger => {
      burger.addEventListener('click', () => {
        const target = document.getElementById(burger.dataset.target);
        burger.classList.toggle('is-active');
        burger.setAttribute('aria-expanded',
          burger.classList.contains('is-active'));
        target.classList.toggle('is-active');
      });
    });
  });
</script>

{% block extra_scripts %}{% endblock %}
</body>
</html>
