name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/belldell/articles-api
  ECR_REGISTRY: "${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"
  ECR_REPOSITORY: "${{ vars.ECR_REPOSITORY }}"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: python -m pytest --cov=app --cov-report=xml -q

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: |
            -Dsonar.python.coverage.reportPaths=coverage.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image for smoke test
        run: docker build -t articles-api:ci .

      - name: Run container and smoke test
        run: |
          CONTAINER_ID=$(docker run -d -p 5002:5000 articles-api:ci)
          trap "docker rm -f $CONTAINER_ID" EXIT

          for i in {1..10}; do
            if curl -sSf http://localhost:5002/health >/dev/null 2>&1; then
              echo "health ok"
              break
            fi

            echo "waiting for container... ($i)"
            sleep 1
          done

          curl -f http://localhost:5002/health

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    env:
      ECR_REGISTRY: "${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"
      ECR_REPOSITORY: "${{ vars.ECR_REPOSITORY }}"

    steps:
      - uses: actions/checkout@v4

      - name: Validate AWS/ECR variables
        run: |
          test -n "${{ vars.AWS_REGION }}" || (echo "AWS_REGION variable is missing" && exit 1)
          test -n "${{ vars.AWS_ACCOUNT_ID }}" || (echo "AWS_ACCOUNT_ID variable is missing" && exit 1)
          test -n "${{ vars.ECR_REPOSITORY }}" || (echo "ECR_REPOSITORY variable is missing" && exit 1)
          test -n "${{ vars.AWS_ROLE_TO_ASSUME }}" || (echo "AWS_ROLE_TO_ASSUME variable is missing" && exit 1)

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image (GHCR + ECR tags)
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest \
            -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            .

      - name: Push to GHCR
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Push to Amazon ECR
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}