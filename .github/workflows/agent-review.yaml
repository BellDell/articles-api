name: Docker Agent Review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Run Docker Agent read-only review
        uses: docker/cagent-action@v1.5.3
        with:
          agent: ./agent-review.yaml
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          timeout: 600
          yolo: false
          prompt: |
            Do not edit files.
            Do not create files.
            Do not run shell commands.

            Inspect only:
            - app/app.py
            - tests/test_articles.py
            - Dockerfile
            - requirements.txt
            - requirements-dev.txt
            - .github/workflows/ci-cd.yml

            Check for obvious Flask API, Docker, and GitHub Actions CI/CD issues.

            Produce a short markdown report with:
            1. Critical issues
            2. Minor issues
            3. Suggested next smallest improvement

            Keep the report concise.