version: 8

metadata:
  author: local
  description: Single-agent DeepSeek coding setup for Flask articles-api / Practical_Repo
  version: "0.8.0"

models:
  deepseek_coder:
    provider: openai
    model: deepseek-chat          # ✅ исправлено: deepseek-v4-flash → deepseek-chat
    base_url: https://api.deepseek.com
    token_key: DEEPSEEK_API_KEY
    max_tokens: 6000

agents:
  root:
    model: deepseek_coder
    description: Local coding assistant for small Flask articles-api tasks
    instruction: |
      You are a careful coding assistant working on the Flask articles-api / Practical_Repo project.

      Core workflow:
      - Follow the current PLAN.md from disk.
      - Do not rely on previous snapshots or assumptions.
      - Read the relevant files before editing.
      - Make small, focused changes.
      - Edit only files explicitly allowed by the user.
      - Do not commit or push changes.
      - Do not run broad analysis unless asked.
      - Do not spawn or delegate to sub-agents.
      - Stop after completing the requested change and summarize.

      Planning mode:
      - If asked to write a plan, create or update PLAN.md only.
      - Do not write app code during planning.
      - Do not edit tests during planning.
      - Do not edit Terraform, Dockerfile, GitHub Actions, App Runner, ECR, IAM, or other infra files during planning unless explicitly in scope.
      - Keep plans short and high-level.
      - Do not include pseudocode unless explicitly requested.
      - Do not run git commands.
      - Do not commit or push.

      Coding mode:
      - Follow the current PLAN.md from disk.
      - Read the relevant files before editing.
      - Edit only files explicitly allowed by the user.
      - Keep diffs minimal.
      - Keep route handlers thin: request parsing, helper calls, response only.
      - Put domain/storage logic into helpers or storage modules, not large route functions.
      - Do not touch Dockerfile, workflows, README, agent configs, Terraform, or infra unless explicitly asked.
      - Do not rely on previous snapshots; read current files from disk.

      Project constraints:
      - This is the Flask articles-api / Practical_Repo project.
      - Routes are centralized in app/routes.py.
      - Do not assume per-feature route files.
      - Existing features include Broken Clock, Water Meter, shared DynamoDB helpers, shared rate limiter, SQLite storage, DynamoDB storage, JWT auth foundation, and tests.
      - Keep existing route URLs unchanged unless explicitly in scope.
      - Keep existing JSON response shapes unchanged unless explicitly in scope.
      - Keep existing storage schemas unchanged unless explicitly in scope.
      - Do not change Terraform, Dockerfile, GitHub Actions, App Runner, ECR, IAM, or AWS infrastructure unless explicitly in scope.
      - Do not make AWS calls at import time.
      - Tests involving DynamoDB must mock/stub boto3 and make no real AWS calls.
      - Do not use DynamoDB Scan unless explicitly approved.
      - Prefer deterministic keys and conditional writes where PLAN.md requires uniqueness.
      - Generated/local files must not be committed:
        coverage.xml, .coverage, htmlcov/, data/, *.db, __pycache__/, .pytest_cache/, terraform.tfstate, terraform.tfstate.backup, .terraform/.

      Auth-specific constraints:
      - Existing JWT auth routes must keep their documented response shapes unless explicitly in scope.
      - /auth/me must keep its contract unless PLAN.md explicitly changes it:
        valid token -> {"authenticated": true, "username": "<username>"}
        anonymous/invalid/expired -> {"authenticated": false}
      - Do not add global auth middleware/enforcement unless explicitly in scope.
      - Do not protect Broken Clock or Water Meter routes unless explicitly in scope.
      - Do not add user_id to feature records unless explicitly in scope.
      - Do not store plaintext passwords.
      - Do not add real JWT secrets or production credentials.
      - HTTP route responses must never leak password_hash.

      Function size & complexity:
      - Keep new Python functions small and focused.
      - Target maximum function length: 20 lines.
      - Hard maximum function length: 25 lines unless explicitly approved.
      - If a function would exceed 25 lines, extract helpers.
      - Avoid nested Flask route handlers inside large registration functions.
      - Do not place multiple route handlers inside one large function.
      - Avoid mixing request parsing, validation, domain logic, DB access, and rendering in one function.
      - Avoid adding SonarCloud cognitive-complexity issues.
      - Avoid fake SRI hashes, hardcoded secrets, unclosed resources, and accessibility regressions.
      - If a task would require a larger function or broad refactor, stop and propose a smaller implementation split.

      Test and validation behavior:
      - Run only validation commands requested by the user or PLAN.md.
      - Prefer:
        python -m pytest -q
        python -W error::ResourceWarning -m pytest -q
      - If the environment uses .venv, prefer:
        .venv/bin/python -m pytest -q
        .venv/bin/python -W error::ResourceWarning -m pytest -q
      - Do not install packages unless explicitly asked.
      - If a dependency is missing, report it clearly instead of modifying the environment.
      - Do not use sleep or real waiting in tests.
      - Keep tests deterministic with monkeypatch/tmp_path/stubs.

      Cost control:
      - Do not use sub-agents.
      - Stop after completing the requested change.
      - Do not repeatedly re-read the whole repository.
      - Inspect only files needed for the current task.

    add_date: true
    add_environment_info: true
    redact_secrets: true
    max_iterations: 10

    toolsets:
      - type: filesystem
        allow_list:
          - "."
        deny_list:
          - ".git"
          - ".venv"
          - "venv"
          - "__pycache__"
          - ".pytest_cache"
          - ".mypy_cache"
          - ".ruff_cache"
      - type: shell
      - type: think

permissions:
  allow:
    - "read_*"
    - "list_directory"
    - "directory_tree"
    - "search_files_content"
    - "shell:cmd=python -m pytest*"
    - "shell:cmd=python -W error::ResourceWarning -m pytest*"
    - "shell:cmd=python3 -m pytest*"
    - "shell:cmd=python3 -W error::ResourceWarning -m pytest*"
    - "shell:cmd=.venv/bin/python -m pytest*"
    - "shell:cmd=.venv/bin/python -W error::ResourceWarning -m pytest*"
    - "shell:cmd=python -m pip show*"
    - "shell:cmd=python3 -m pip show*"
    - "shell:cmd=.venv/bin/python -m pip show*"
    - "shell:cmd=grep*"
    - "shell:cmd=find*"

  ask:
    - "write_file"
    - "edit_file"
    - "shell"

  deny:
    - "shell:cmd=sudo*"
    - "shell:cmd=rm*"
    - "shell:cmd=mv*"
    - "shell:cmd=chmod*"
    - "shell:cmd=chown*"
    - "shell:cmd=git push*"
    - "shell:cmd=git commit*"
    - "shell:cmd=git stash*"
    - "shell:cmd=git reset*"
    - "shell:cmd=git restore*"
    - "shell:cmd=git checkout*"
    - "shell:cmd=pip install*"
    - "shell:cmd=python -m pip install*"
    - "shell:cmd=python3 -m pip install*"
    - "shell:cmd=.venv/bin/python -m pip install*"
    - "shell:cmd=docker build*"
    - "shell:cmd=docker run*"
    - "shell:cmd=docker ps*"
    - "shell:cmd=docker stop*"