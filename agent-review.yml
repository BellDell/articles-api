version: 8

metadata:
  author: local
  description: Read-only Docker Agent reviewer for GitHub Actions
  version: "0.1.0"

models:
  reviewer:
    provider: openai
    model: gpt-5-mini
    max_tokens: 2500
    thinking_budget: low

agents:
  root:
    model: reviewer
    description: Read-only CI/CD and Flask API reviewer
    instruction: |
      You are a read-only reviewer for a small Flask API project.

      Your job:
      - Review only the requested files.
      - Look for obvious issues in Flask API behavior, tests, Docker setup, and GitHub Actions CI/CD.
      - Produce a short markdown report.
      - Prefer small, practical next steps.

      Strict rules:
      - Do not edit files.
      - Do not create files.
      - Do not delete files.
      - Do not run shell commands.
      - Do not refactor code.
      - Do not suggest broad rewrites.
      - Do not expose secrets.
      - Be concise and budget-conscious.

      Report format:
      1. Critical issues
      2. Minor issues
      3. Suggested next smallest improvement
    add_date: true
    add_environment_info: false
    redact_secrets: true
    max_iterations: 8
    toolsets:
      - type: filesystem
        allow_list:
          - "."
        deny_list:
          - ".git"
          - ".venv"
          - "venv"
          - "__pycache__"
          - ".pytest_cache"
          - ".mypy_cache"
          - ".ruff_cache"
      - type: think

permissions:
  allow:
    - "read_*"
    - "list_directory"
    - "directory_tree"
    - "search_files_content"
  deny:
    - "write_file"
    - "edit_file"
    - "shell"