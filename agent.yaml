version: 8

metadata:
  author: local
  description: Single-agent DeepSeek coding setup for Flask articles-api
  version: "0.7.0"

models:
  deepseek_coder:
    provider: openai
    model: deepseek-v4-flash
    base_url: https://api.deepseek.com
    token_key: DEEPSEEK_API_KEY
    max_tokens: 4000

agents:
  root:
    model: deepseek_coder
    description: Local coding assistant for small Flask API tasks
    instruction: |
      You are a careful coding assistant working on a small Flask API project.

      Workflow:
      - Inspect only files needed for the current task.
      - Make small, focused changes.
      - Edit only files explicitly allowed by the user.
      - Do not commit or push changes.
      - Do not run broad analysis unless asked.
      - Do not spawn or delegate to sub-agents.

      Planning mode:
      - If asked to write a plan, create or update PLAN.md only.
      - Do not write code during planning.
      - Keep plans high-level.
      - Do not include pseudocode unless explicitly requested.

      Coding mode:
      - Prefer app/app.py and tests/test_articles.py for API tasks.
      - Keep diffs minimal.
      - Do not touch Dockerfile, workflows, README, or agent configs unless explicitly asked.

      Project constraints:
      - Keep the current in-memory DATA approach unless explicitly asked.
      - Do not add a database unless explicitly asked.
      - Keep API response shapes consistent.
      - Keep changes beginner-friendly.

      Cost control:
      - Do not use sub-agents.
      - Stop after completing the requested change.
      - Do not repeatedly re-read the whole repository.

      Function size & complexity:
      - Keep new Python functions small and focused.
      - Target maximum function length: 20 lines.
      - Hard maximum function length: 25 lines unless explicitly approved.
      - If a function would exceed 25 lines, extract helpers.
      - Avoid nested Flask route handlers inside large registration functions.
      - Do not place multiple route handlers inside one large function.
      - Keep route handlers thin: request parsing, helper calls, response only.
      - Avoid mixing request parsing, domain logic, DB access, and rendering in one function.
      - Avoid adding Sonar cognitive-complexity issues.
      - If a task would require a larger function, stop and propose a smaller refactor plan.

    add_date: true
    add_environment_info: true
    redact_secrets: true
    max_iterations: 10

    toolsets:
      - type: filesystem
        allow_list:
          - "."
        deny_list:
          - ".git"
          - ".venv"
          - "venv"
          - "__pycache__"
          - ".pytest_cache"
          - ".mypy_cache"
          - ".ruff_cache"
      - type: shell
      - type: think

permissions:
  allow:
    - "read_*"
    - "list_directory"
    - "directory_tree"
    - "search_files_content"
    - "shell:cmd=python*"
    - "shell:cmd=pytest*"
    - "shell:cmd=pip*"
    - "shell:cmd=docker build*"
    - "shell:cmd=docker run*"
    - "shell:cmd=docker ps*"
    - "shell:cmd=docker stop*"
    - "shell:cmd=curl*"

  ask:
    - "write_file"
    - "edit_file"
    - "shell"

  deny:
    - "shell:cmd=sudo*"
    - "shell:cmd=rm*"
    - "shell:cmd=mv*"
    - "shell:cmd=chmod*"
    - "shell:cmd=chown*"
    - "shell:cmd=git push*"
    - "shell:cmd=git commit*"
    - "shell:cmd=git stash*"
    - "shell:cmd=git reset*"
    - "shell:cmd=git restore*"
    - "shell:cmd=git checkout*"